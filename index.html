<style>
@font-face {
  font-family: "VT323";
  src: url("fonts/vt323-latin.woff2?v=bf182d50") format("woff2");
  font-display: swap;
}
[hidden] { display: none !important; }
html, body {
  margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none;
  background: #05070c; color: #f4ead0;
  font-family: "VT323", "Courier New", monospace;
  touch-action: none; -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#palco { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh; transform-origin: 0 0; }
#jogo { position: absolute; inset: 0; touch-action: none; }
#jogo .zmb { min-height: 0; aspect-ratio: auto; height: 100%; }
.quadro {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 18px;
  padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  text-align: center; background: #05070c; font-size: 28px; line-height: 1.1;
}
.quadro p { margin: 0; max-width: 30ch; }
.quadro .forte { color: #8fd16a; font-size: 40px; }
.quadro .linha { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
button {
  font: inherit; font-size: 24px; line-height: 1; color: #f4ead0; background: #1a2238;
  border: 2px solid #3a4870; border-radius: 6px; min-height: 48px; min-width: 48px; padding: 10px 16px; cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible { outline: 2px solid #ffd36e; outline-offset: 2px; }
.grande { min-height: 56px; font-size: 28px; background: #2c3f22; border-color: #8fd16a; }
#barra {
  position: absolute; left: 0; top: 0; display: flex; gap: 8px; z-index: 2;
  padding: max(10px, env(safe-area-inset-top)) 10px 10px max(10px, env(safe-area-inset-left));
}
#barra button { font-size: 20px; padding: 8px 10px; background: rgba(10, 14, 28, 0.82); }
body[data-jogando="1"] #barra { display: none; }
#gire .celular {
  justify-self: center; width: 46px; height: 78px; border: 4px solid #f4ead0; border-radius: 9px; box-sizing: border-box;
  animation: girar 1.2s ease-in-out infinite alternate;
}
@keyframes girar { from { transform: rotate(0); } to { transform: rotate(-90deg); } }
@media (prefers-reduced-motion: reduce) { #gire .celular { animation: none; transform: rotate(-90deg); } }
#recado {
  position: absolute; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 3;
  background: rgba(10, 14, 28, 0.92); border: 2px solid #ff9a8a; border-radius: 6px; padding: 8px 14px; font-size: 22px; white-space: nowrap;
}
#perf { position: absolute; right: 8px; bottom: 8px; z-index: 4; font-size: 18px; background: rgba(0,0,0,.7); padding: 4px 8px; pointer-events: none; }
</style>
<script>
  // Se o jogo não subir em 8 s (ou estourar um erro antes), troca o CARREGANDO pelo aviso de falha.
  (function () {
    function falha(motivo) {
      if (window.__zmbOk || window.__zmbFalhou) return;
      window.__zmbFalhou = true;
      var f = document.getElementById('falha'), c = document.getElementById('carregando');
      if (!f) return;
      if (c) c.hidden = true;
      var m = document.getElementById('falha-motivo'); if (m) m.textContent = motivo || '';
      f.hidden = false;
    }
    window.__zmbFalha = falha;
    window.addEventListener('error', function (e) {
      var alvo = e && e.target && e.target.src ? ' Faltou: ' + e.target.src.split('/').pop().split('?')[0] : '';
      falha(alvo || ('Erro: ' + (e && e.message ? e.message : 'desconhecido')));
    }, true);
    setTimeout(function () { falha('O jogo não respondeu em 8 segundos.'); }, 8000);
  })();
</script>
</head>
<body data-jogando="0">
<div id="palco">
  <div id="jogo">
    <div class="quadro" id="carregando"><p class="forte">NOITE DOS ZUMBIS</p><p>CARREGANDO...</p></div>
  </div>
  <div id="barra" hidden>
    <button type="button" id="b-som" aria-pressed="true">SOM</button>
    <button type="button" id="b-cheia" hidden>TELA CHEIA</button>
    <button type="button" id="b-virar" hidden>VIRAR</button>
  </div>
  <div id="recado" hidden></div>
</div>
<div class="quadro" id="gire" hidden>
  <div class="celular" aria-hidden="true"></div>
  <p class="forte">GIRE O CELULAR</p>
  <p>O jogo fica melhor deitado.</p>
  <div class="linha"><button type="button" class="grande" id="b-empe">JOGAR EM PÉ</button></div>
</div>
<div class="quadro" id="falha" hidden>
  <p class="forte">SEU NAVEGADOR NÃO ABRIU O JOGO</p>
  <p>Abra no Chrome ou no Safari.</p>
  <p id="falha-motivo" style="font-size:20px;color:#ff9a8a"></p>
  <div class="linha">
    <button type="button" id="b-copiar" onclick="var b=this;try{navigator.clipboard.writeText(location.href.split('?')[0]).then(function(){b.textContent='LINK COPIADO'},function(){b.textContent=location.href.split('?')[0]})}catch(e){b.textContent=location.href.split('?')[0]}">COPIAR LINK</button>
    <button type="button" id="b-tentar" onclick="location.reload()">TENTAR DE NOVO</button>
  </div>
</div>
<noscript><div class="quadro"><p class="forte">NOITE DOS ZUMBIS</p><p>Ligue o JavaScript para jogar.</p></div></noscript>

<script src="zumbis.js?v=13fb2609" defer></script>
<script src="jogo.js?v=891a2c89" defer></script>
</body>
</html>
